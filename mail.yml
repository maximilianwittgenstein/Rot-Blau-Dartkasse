name: E-Mails versenden

on:
  schedule:
    # alle zwei Stunden zwischen etwa 7 und 23 Uhr deutscher Zeit
    - cron: "7 6-22/2 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Nur eine Test-E-Mail an das Vereinspostfach schicken"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: vereins-mails
  cancel-in-progress: false

jobs:
  mails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: E-Mails prüfen und verschicken
        env:
          GMX_USER: ${{ secrets.GMX_USER }}
          GMX_PASS: ${{ secrets.GMX_PASS }}
          APP_URL: ${{ vars.APP_URL }}
          ADMIN_MAIL: ${{ vars.ADMIN_MAIL }}
          TEST_MAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: python3 scripts/mail.py

      - name: Versandprotokoll speichern
        run: |
          git config user.name "Vereins-App"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mail-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "E-Mail-Versand protokolliert"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 5; done
          exit 1
