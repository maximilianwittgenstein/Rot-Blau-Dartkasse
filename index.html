<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E1C38">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dartkasse">
<title>Getränkekasse – DC Rot-Blau Wuppertal</title>
<style>
:root{
  --rot:#C8102E; --rot-d:#A00D25; --blau:#0B3C8C; --blau-hell:#1F5BD6; --nacht:#0E1C38;
  --bg:#EEF1F6; --card:#FFFFFF; --ink:#14213D; --muted:#5B6782; --line:#D8DEEA;
  --fp:#B7791F; --fp-bg:#FBF1DE; --ok:#1E7F4F; --ok-bg:#E3F4EA; --warn-bg:#FDE8EB;
  --font: Bahnschrift, "DIN Alternate", "DIN Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0A1325; --card:#132039; --ink:#E8EDF7; --muted:#9AA7C2; --line:#253658;
    --fp-bg:#3A2C12; --ok-bg:#12382A; --warn-bg:#3d1520; --blau:#2A63C9; color-scheme: dark; }
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #4C8DFF;outline-offset:2px}

/* Kopf */
header.top{background:var(--nacht);color:#fff;position:sticky;top:0;z-index:10}
.top-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand .logo{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.brand .logo img{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:1.3rem;margin:0;font-weight:700;letter-spacing:.01em;line-height:1.1}
.brand p{margin:2px 0 0;font-size:.85rem;opacity:.7}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{background:transparent;border:0;color:#fff;padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:600;opacity:.8}
nav.tabs button:hover{opacity:1;background:rgba(255,255,255,.08)}
nav.tabs button.on{background:#fff;color:var(--nacht);opacity:1}
.filechip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:.85rem;max-width:280px}
.filechip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:#F2B233}
.dot.ok{background:#3DD68C}.dot.err{background:#FF5470}
.ring{height:8px;background:repeating-linear-gradient(90deg,var(--rot) 0 30px,var(--blau-hell) 30px 60px)}

main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
h2{font-size:1.45rem;margin:0 0 14px}
h3{font-size:1.1rem;margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--rot);border-color:var(--rot);color:#fff}
.btn.primary:hover{background:var(--rot-d)}
.btn.blue{background:var(--blau);border-color:var(--blau);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--rot);border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
textarea{width:100%;min-height:140px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
label.f > *{color:var(--ink);font-weight:400;font-size:1rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.2rem;margin-bottom:6px}

/* Spieltag */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;border-radius:18px;overflow:hidden;margin-bottom:16px;min-height:96px}
.vs .side{padding:16px 22px;color:#fff;display:flex;flex-direction:column;justify-content:center}
.vs .home{background:var(--rot)}
.vs .away{background:var(--blau);text-align:right}
.vs .side b{font-size:clamp(1.15rem,2.6vw,1.8rem);line-height:1.1}
.vs .side small{opacity:.85}
.vs .mid{background:var(--nacht);color:#fff;display:grid;place-items:center;padding:0 18px;font-weight:700;font-size:1.1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .k{font-size:.85rem;color:var(--muted)}
.stat .v{font-size:1.5rem;font-weight:700}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:8px}
.split i{display:block;height:100%}
.split .v1{background:var(--blau)} .split .v2{background:var(--fp)}
.legend{display:flex;gap:12px;font-size:.8rem;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}

.teams{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:980px){.teams{grid-template-columns:1fr}}
.team{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;border-top:6px solid var(--rot)}
.team.gast{border-top-color:var(--blau)}
.team > header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.addp{display:flex;gap:8px;margin-bottom:10px}
.addp input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:4px 11px;cursor:pointer;font-size:.88rem}
.chip:hover{border-style:solid}
.chip.all{border-style:solid;font-weight:600}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.person.paid{border-color:var(--ok);background:var(--ok-bg)}
.person.part{border-color:var(--fp)}
.person .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.person .ph strong{font-size:1.08rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.2rem;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--rot)}
.cnt{display:grid;grid-template-columns:1fr 40px 34px 40px;align-items:center;gap:6px;margin-bottom:6px}
.cnt span{font-size:.95rem}
.cnt b{text-align:center;font-size:1.15rem}
.cnt button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1.3rem;font-weight:700;line-height:1}
.cnt button.plus{background:var(--blau);border-color:var(--blau);color:#fff}
.cnt button:disabled{opacity:.35;cursor:default}
.pf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.pf .sum{font-size:1.25rem;font-weight:700}
.pay{border-radius:10px;padding:8px 12px;border:0;cursor:pointer;font-weight:700;background:var(--rot);color:#fff}
.pay.done{background:var(--ok)}
.pay.rest{background:var(--fp)}
.pay:disabled{background:var(--line);color:var(--muted);cursor:default}
.note{font-size:.8rem;color:var(--muted);margin-top:4px}

/* Tabellen & Kennzahlen */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.82rem;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.fig{border-radius:16px;padding:16px 18px;background:var(--card);border:1px solid var(--line)}
.fig .k{color:var(--muted);font-size:.9rem}
.fig .v{font-size:2rem;font-weight:700;line-height:1.15;margin-top:2px}
.fig.cash{background:var(--nacht);color:#fff;border-color:var(--nacht)}
.fig.cash .k{color:rgba(255,255,255,.7)}
.fig.fp{background:var(--fp-bg);border-color:var(--fp)}
.stock{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
@media (max-width:640px){.stock{grid-template-columns:1fr}}
.stock .fig .v{color:var(--blau)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.tag{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--line)}
.tag.fp{background:var(--fp-bg);color:var(--fp)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--nacht);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

@media (max-width:700px){
  .top-inner{padding:8px 12px;gap:8px}
  .brand .logo{width:42px;height:42px}
  .brand h1{font-size:1.02rem}
  .brand p{display:none}
  nav.tabs{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav.tabs button{white-space:nowrap;padding:8px 12px}
  .filechip{max-width:150px;padding:6px 10px}
  main{padding:14px 12px 70px}
  .vs{min-height:80px}.vs .side{padding:10px 12px}.vs .mid{padding:0 8px}
  .people{grid-template-columns:1fr}
  .team{padding:12px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat .v{font-size:1.25rem}
}
dialog{border:0;border-radius:16px;padding:20px;max-width:440px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(14,28,56,.55)}
dialog h3{margin-bottom:8px}
dialog .row{margin-top:14px}
body.locked nav.tabs, body.locked [data-act=share]{display:none}
.lock{max-width:440px;margin:40px auto;text-align:center}
.lock .lock-logo{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;overflow:hidden;background:#fff;display:grid;place-items:center}
.lock .lock-logo img,.lock .lock-logo svg{width:100%;height:100%;object-fit:contain}
.lock h2{font-size:1.6rem;margin-bottom:4px}
.lock form{text-align:left;margin-top:22px}
.lock input[type=password]{width:100%}
.lock details{margin-top:10px;font-size:.9rem;color:var(--muted)}
.lock details .grid2{margin-top:8px}
.lock .btn{width:100%;margin-top:12px;padding:12px}
.msg-err{color:var(--rot);font-size:.9rem;margin-top:10px}
.vs.solo{grid-template-columns:1fr}
.vs.solo .home{background:linear-gradient(100deg,var(--rot) 0 55%,var(--blau) 55%)}
.teams.solo{grid-template-columns:1fr}
/* Druck */
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  body > *:not(#print){display:none !important}
  #print{display:block;font-family:var(--font);color:#000}
  #print h1{font-size:20px;margin:0}
  #print h2{font-size:15px;margin:18px 0 6px}
  #print table{font-size:13px}
  #print th,#print td{border-bottom:1px solid #bbb;padding:5px 6px}
  #print .phead{display:flex;align-items:center;gap:12px;border-bottom:4px solid #C8102E;padding-bottom:8px;margin-bottom:10px}
  #print .phead img,#print .phead svg{width:56px;height:56px}
  #print .tot{font-weight:700}
}
</style>
</head>
<body>

<template id="fallbackLogo">
  <svg viewBox="0 0 100 100" width="100%" height="100%" aria-label="Vereinsemblem">
    <circle cx="50" cy="50" r="48" fill="#0E1C38"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#1F5BD6" stroke-width="12"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#C8102E" stroke-width="12" stroke-dasharray="11.94 11.94"/>
    <circle cx="50" cy="50" r="27" fill="#fff"/>
    <text x="50" y="58" text-anchor="middle" font-family="Bahnschrift, Arial, sans-serif" font-weight="700" font-size="22" fill="#0E1C38">RB</text>
  </svg>
</template>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="logo" id="logoBox"></div>
      <div><h1 id="clubName">DC Rot-Blau Wuppertal</h1><p>Getränkekasse</p></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-act="tab" data-tab="spieltag">Spieltag</button>
      <button data-act="tab" data-tab="bestand">Bestand &amp; Einkauf</button>
      <button data-act="tab" data-tab="kasse">Kasse</button>
      <button data-act="tab" data-tab="einstellungen">Einstellungen</button>
    </nav>
    <button class="filechip" data-act="share" title="Aktuellen Stand per WhatsApp & Co. teilen"><span>Stand teilen</span></button>
    <button class="filechip" id="fileChip" data-act="tab" data-tab="einstellungen" title="Speicherort"><i class="dot" id="fileDot"></i><span id="fileText">…</span></button>
  </div>
  <div class="ring"></div>
</header>

<main id="app"></main>
<div id="print"></div>
<div class="toast" id="toast"></div>
<dialog id="impDlg"><h3>Stand laden</h3><p id="impInfo" class="small"></p>
  <p class="muted small"><b>Zusammenführen</b> ergänzt alles, was im geladenen Stand neu ist, und übernimmt dort gelöschte Einträge. Deine eigenen Einträge bleiben erhalten. <b>Ersetzen</b> verwirft deinen bisherigen Stand.</p>
  <div class="row"><button class="btn primary" data-imp="merge">Zusammenführen</button><button class="btn" data-imp="replace">Ersetzen</button><button class="btn ghost" data-imp="cancel">Abbrechen</button></div></dialog>
<input type="file" id="impFile" accept=".json,.txt,application/json,text/plain" hidden>
<input type="file" id="logoFile" accept="image/*" hidden>

<script>
/* ===================== Grundlagen ===================== */
const CATS=[{k:'bier',n:'Bier',i:'🍺'},{k:'wasser',n:'Wasser',i:'💧'},{k:'soft',n:'Softdrink',i:'🥤'}];
const CATN=Object.fromEntries(CATS.map(c=>[c.k,c.n]));
const LS_KEY='dartkasse-rotblau-v1';
const FS_OK=('showOpenFilePicker' in window)&&('showSaveFilePicker' in window);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Math.round((n||0)*100)/100);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const fmtDate=d=>{if(!d)return'';const [y,m,dd]=d.split('-');return new Date(+y,m-1,+dd).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})};
const fmtTs=t=>new Date(t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};

function blank(){return{app:'dartkasse',version:1,savedAt:null,
  settings:{club:'DC Rot-Blau Wuppertal',prices:{bier:2,wasser:1.5,soft:1.5},fp:{bier:2,wasser:1.5,soft:1.5},startKasse:0,roster:[]},
  logo:null,batches:[],matchdays:[],sales:[],moves:[],deleted:[]}}
function normalize(d){const b=blank();d=d||{};
  const s=Object.assign({},b.settings,d.settings||{});
  s.prices=Object.assign({},b.settings.prices,(d.settings||{}).prices||{});
  s.fp=Object.assign({},b.settings.fp,(d.settings||{}).fp||{});
  s.roster=Array.isArray(s.roster)?s.roster:[];
  return{...b,...d,app:'dartkasse',settings:s,batches:d.batches||[],matchdays:d.matchdays||[],sales:d.sales||[],moves:d.moves||[],deleted:d.deleted||[]}}
const hasData=d=>d&&(d.matchdays.length||d.batches.length||d.sales.length||d.moves.length);

let D=blank();
let ui={tab:'spieltag',md:null,showNewMd:false,focus:null};

/* ===================== Berechnung (FIFO) ===================== */
// Vereinsflaschen werden zuerst verkauft (ältester Einkauf zuerst).
// Ein Einkauf gilt nur für Verkäufe, die nach seinem Zeitpunkt gebucht wurden.
function compute(){
  const rem={},cpu={};
  D.batches.forEach(b=>{rem[b.id]=b.qty;cpu[b.id]=b.qty?b.cost/b.qty:0});
  const byCat={};CATS.forEach(c=>byCat[c.k]=D.batches.filter(b=>b.cat===c.k).sort((a,b)=>a.ts-b.ts));
  const alloc={};
  const train=new Set(D.matchdays.filter(m=>m.type==='training').map(m=>m.id));
  [...D.sales].sort((a,b)=>a.ts-b.ts).forEach(s=>{
    if(train.has(s.md)){alloc[s.id]={v:0,vc:0,f:s.qty};return}
    let q=s.qty,v=0,vc=0;
    for(const b of byCat[s.cat]||[]){if(q<=0||b.ts>s.ts)break;const t=Math.min(q,rem[b.id]);if(t>0){rem[b.id]-=t;q-=t;v+=t;vc+=t*cpu[b.id]}}
    alloc[s.id]={v,vc,f:q};
  });
  return{rem,alloc};
}
const salesOf=(md,p)=>D.sales.filter(s=>s.md===md.id&&s.p===p.id);
const countOf=(md,p,cat)=>salesOf(md,p).filter(s=>s.cat===cat).reduce((a,s)=>a+s.qty,0);
const totalOf=(md,p)=>salesOf(md,p).reduce((a,s)=>a+s.qty*s.price,0);
function totals(){
  const C=compute();
  let paid=0,open=0,over=0;
  D.matchdays.forEach(m=>m.people.forEach(p=>{const t=totalOf(m,p),pd=p.paid||0;paid+=pd;if(t>pd)open+=t-pd;else over+=pd-t}));
  const buy=D.batches.filter(b=>b.fromKasse).reduce((a,b)=>a+b.cost,0);
  const mv=D.moves.reduce((a,m)=>a+m.amt,0);
  const cash=num(D.settings.startKasse)+paid-buy+mv;
  let fpEarned=0,rev=0,cost=0;const cat={};CATS.forEach(c=>cat[c.k]={n:0,v:0,f:0,u:0});
  D.sales.forEach(s=>{const a=C.alloc[s.id];fpEarned+=a.f*(s.fp??s.price);rev+=a.v*s.price;cost+=a.vc;
    const c=cat[s.cat];c.n+=s.qty;c.v+=a.v;c.f+=a.f;c.u+=s.qty*s.price});
  const fpPaid=-D.moves.filter(m=>m.type==='fp').reduce((a,m)=>a+m.amt,0);
  const stock={};CATS.forEach(c=>stock[c.k]=D.batches.filter(b=>b.cat===c.k).reduce((a,b)=>a+C.rem[b.id],0));
  return{C,paid,open,over,cash,fpEarned,fpPaid,fpDue:fpEarned-fpPaid,profit:rev-cost,cat,stock};
}

/* ===================== Speichern ===================== */
let fh=null,fhName=null,fhPending=null,saveTimer=null,fileState='none',fileErr='';
function save(){
  D.savedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(D))}catch(e){}
  if(fh){fileState='saving';clearTimeout(saveTimer);saveTimer=setTimeout(writeFile,300)}
  if(typeof syncOn==='function'&&syncOn()){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,2500);if(syncState!=='busy'){syncState='pending'}}
  status();
}
async function writeFile(){
  if(!fh)return;
  try{const w=await fh.createWritable();await w.write(JSON.stringify(D,null,2));await w.close();fileState='ok';fileErr=''}
  catch(e){fileState='err';fileErr=e.message||String(e)}
  status();
}
function status(){
  const dot=document.getElementById('fileDot'),t=document.getElementById('fileText');
  dot.className='dot';
  if(typeof locked==='function'&&locked()){t.textContent=syncOn()?'Token prüfen':'Kein Token';return}
  if(typeof syncOn==='function'&&syncOn()){
    const tm=lastSync?new Date(lastSync).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'';
    if(syncState==='err'){dot.classList.add('err');t.textContent='Abgleich-Fehler'}
    else if(syncState==='busy'){t.textContent='Gleicht ab …'}
    else if(syncState==='pending'){t.textContent='Änderung wird hochgeladen'}
    else if(syncState==='offline'){t.textContent='Offline, gleicht später ab'}
    else if(syncState==='ok'){dot.classList.add('ok');t.textContent='Online, Stand '+tm}
    else{t.textContent='Online-Abgleich startet'}
    return}
  if(fh&&fileState==='err'){dot.classList.add('err');t.textContent='Speichern fehlgeschlagen'}
  else if(fh){dot.classList.add('ok');t.textContent=fileState==='saving'?'Speichert …':'Gespeichert: '+fhName}
  else if(fhPending){t.textContent='Datei erneut verbinden'}
  else{t.textContent=FS_OK?'Nur im Browser gespeichert':'Auf diesem Gerät gespeichert'}
}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('dartkasse',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const t=db.transaction('kv');const q=t.objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
async function idbDel(k){try{const db=await idb();await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res})}catch(e){}}
const FTYPES=[{description:'Getränkekasse-Daten',accept:{'application/json':['.json']}}];

async function useHandle(h){
  let perm=await h.queryPermission({mode:'readwrite'});
  if(perm!=='granted')perm=await h.requestPermission({mode:'readwrite'});
  if(perm!=='granted'){toast('Zugriff auf die Datei wurde nicht erlaubt.');return}
  const txt=await (await h.getFile()).text();
  let d=null;
  if(txt.trim()){try{d=JSON.parse(txt)}catch(e){toast('Die Datei ist keine gültige Kassen-Datei.');return}
    if(d.app!=='dartkasse'){toast('Diese Datei gehört nicht zur Getränkekasse.');return}}
  fh=h;fhName=h.name;fhPending=null;await idbSet('fh',h);
  if(d){
    const localNewer=hasData(D)&&D.savedAt&&(!d.savedAt||D.savedAt>d.savedAt);
    if(localNewer&&confirm('Die Daten in diesem Browser sind neuer als die in „'+h.name+'“.\n\nOK = Browserdaten in die Datei schreiben\nAbbrechen = Daten aus der Datei laden')){await writeFile()}
    else{D=normalize(d);try{localStorage.setItem(LS_KEY,JSON.stringify(D))}catch(e){};fileState='ok'}
  }else{await writeFile()}
  renderHeader();render();status();toast('Verbunden mit '+h.name);
}

function tomb(...ids){ids.forEach(id=>{if(id&&!D.deleted.includes(id))D.deleted.push(id)})}
function mergeData(a,b){
  a=normalize(JSON.parse(JSON.stringify(a)));b=normalize(b);
  const ms=new Map(a.matchdays.map(m=>[m.id,m]));
  b.matchdays.forEach(m=>{const e=ms.get(m.id);if(!e){a.matchdays.push(m);return}
    const ps=new Map(e.people.map(p=>[p.id,p]));
    m.people.forEach(p=>{const ep=ps.get(p.id);if(!ep)e.people.push(p);else if((p.paidTs||0)>(ep.paidTs||0)){ep.paid=p.paid;ep.paidTs=p.paidTs}})});
  ['sales','batches','moves'].forEach(k=>{const ids=new Set(a[k].map(x=>x.id));b[k].forEach(x=>{if(!ids.has(x.id))a[k].push(x)})});
  const del=new Set([...a.deleted,...b.deleted]);a.deleted=[...del];
  a.matchdays=a.matchdays.filter(m=>!del.has(m.id));a.matchdays.forEach(m=>m.people=m.people.filter(p=>!del.has(p.id)));
  ['sales','batches','moves'].forEach(k=>a[k]=a[k].filter(x=>!del.has(x.id)));
  if((b.settingsTs||0)>(a.settingsTs||0)){a.settings=b.settings;a.logo=b.logo||null;a.settingsTs=b.settingsTs}
  a.savedAt=Math.max(a.savedAt||0,b.savedAt||0)||null;
  return a;
}

/* ===================== Online-Abgleich (GitHub) ===================== */
// Der Token wird nur auf diesem Gerät gespeichert und nie in den Kassenstand oder geteilte Dateien geschrieben.
const SYNC_KEY='dartkasse-sync-v1';
const ghOwnerGuess=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'';
let SY={owner:ghOwnerGuess,repo:'Rot-Blau-Dartkasse-Daten',path:'kasse.json',branch:'main',token:''};
try{Object.assign(SY,JSON.parse(localStorage.getItem(SYNC_KEY)||'{}'))}catch(e){}
let syncState='off',syncErr='',syncTimer=null,syncBusy=false,syncAgain=false,lastSync=null,deferRender=false;
function syncOn(){return!!(SY.token&&SY.owner&&SY.repo)}
function locked(){return!syncOn()||!!SY.blocked}
function saveSyncCfg(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}}
const b64e=str=>{const by=new TextEncoder().encode(str);let bin='';for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin)};
const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const ghRepoUrl=()=>`https://api.github.com/repos/${encodeURIComponent(SY.owner.trim())}/${encodeURIComponent(SY.repo.trim())}`;
const ghUrl=()=>ghRepoUrl()+'/contents/'+SY.path.split('/').map(encodeURIComponent).join('/');
const ghH=(acc)=>({'Authorization':'Bearer '+SY.token.trim(),'Accept':acc||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
function mkErr(st){const e=new Error(ghErr(st));e.auth=(st===401||st===403);return e}
function ghErr(st){if(st===401)return'Der Token ist ungültig oder abgelaufen.';if(st===403)return'Der Token darf dieses Repository nicht beschreiben. Prüfe die Berechtigung „Contents: Read and write“.';return'GitHub antwortet mit Fehler '+st+'.'}
async function ghGet(){
  const q='?ref='+encodeURIComponent(SY.branch)+'&t='+Date.now();
  const r=await fetch(ghUrl()+q,{headers:ghH(),cache:'no-store'});
  if(r.status===404){const rr=await fetch(ghRepoUrl()+'?t='+Date.now(),{headers:ghH(),cache:'no-store'});
    if(rr.status===404){const e=new Error('Das Daten-Repository „'+SY.owner+'/'+SY.repo+'“ wurde nicht gefunden, oder der Token hat keinen Zugriff darauf.');e.auth=true;throw e}
    if(!rr.ok)throw mkErr(rr.status);return{data:null,sha:null}}
  if(!r.ok)throw mkErr(r.status);
  const j=await r.json();let txt;
  if(j.content&&j.encoding==='base64')txt=b64d(j.content);
  else{const rr=await fetch(ghUrl()+q,{headers:ghH('application/vnd.github.raw+json'),cache:'no-store'});if(!rr.ok)throw mkErr(rr.status);txt=await rr.text()}
  let d;try{d=JSON.parse(txt)}catch(e){throw new Error('Die Datei '+SY.path+' im Daten-Repository ist beschädigt.')}
  return{data:normalize(d),sha:j.sha}
}
async function ghPut(d,sha){
  const body={message:'Kassenstand '+fmtTs(Date.now()),content:b64e(JSON.stringify(d,null,1)),branch:SY.branch};if(sha)body.sha=sha;
  const r=await fetch(ghUrl(),{method:'PUT',headers:{...ghH(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return false; // jemand anderes hat gerade gespeichert: neu laden und erneut zusammenführen
  if(!r.ok)throw mkErr(r.status);return true
}
function canon(d){const byId=a=>[...a].sort((x,y)=>x.id<y.id?-1:x.id>y.id?1:0);
  return JSON.stringify({s:d.settings,st:d.settingsTs||0,l:d.logo||null,m:byId(d.matchdays).map(m=>({...m,people:byId(m.people)})),sa:byId(d.sales),b:byId(d.batches),mv:byId(d.moves),del:[...d.deleted].sort()})}
async function syncNow(){
  if(!syncOn())return;
  if(syncBusy){syncAgain=true;return}
  if(!navigator.onLine){syncState='offline';if(SY.blocked){ui.checking=false;syncErr='Keine Internetverbindung. Zum Freischalten wird Internet benötigt.';render()}status();return}
  clearTimeout(syncTimer);syncBusy=true;syncState='busy';status();
  try{
    let done=false;
    for(let i=0;i<5&&!done;i++){
      const{data:remote,sha}=await ghGet();
      const merged=remote?mergeData(remote,D):normalize(JSON.parse(JSON.stringify(D)));
      if(!remote||canon(merged)!==canon(remote)){if(!(await ghPut(merged,sha)))continue}
      if(canon(merged)!==canon(D)){
        const before=canon(D);D=mergeData(D,merged);
        if(canon(D)!==before){try{localStorage.setItem(LS_KEY,JSON.stringify(D))}catch(e){};if(fh)writeFile();softRender()}
      }
      done=true;
    }
    if(!done)throw new Error('Mehrere Geräte speichern gerade gleichzeitig. Bitte gleich noch einmal abgleichen.');
    syncState='ok';syncErr='';lastSync=Date.now();
    if(SY.blocked){SY.blocked=false;saveSyncCfg();ui.checking=false;renderHeader();render()}
  }catch(e){syncState=navigator.onLine?'err':'offline';syncErr=navigator.onLine?(e.message||String(e)):'Keine Internetverbindung. Zum Freischalten wird Internet benötigt.';
    if(e.auth&&!SY.blocked){SY.blocked=true;saveSyncCfg()}
    if(SY.blocked){ui.checking=false;render()}}
  syncBusy=false;status();if(ui.tab==='einstellungen')softRender();
  if(syncAgain){syncAgain=false;syncNow()}
}
function softRender(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#app')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){deferRender=true;return}
  document.getElementById('clubName').textContent=D.settings.club;render()
}
document.addEventListener('focusout',()=>{if(deferRender)setTimeout(()=>{const a=document.activeElement;if(deferRender&&!(a&&a.closest&&a.closest('#app')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){deferRender=false;renderHeader();render()}},350)});
window.addEventListener('online',()=>syncNow());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
setInterval(()=>{if(document.visibilityState==='visible'&&!syncBusy)syncNow()},60000);

function suggestions(md,team){
  const present=new Set(md.people.filter(p=>p.team===team).map(p=>p.name.toLowerCase()));
  let names=[];
  if(team==='heim'){names=[...D.settings.roster];
    [...D.matchdays].sort((a,b)=>b.date.localeCompare(a.date)).forEach(m=>m.people.filter(p=>p.team==='heim').forEach(p=>names.push(p.name)))}
  else{const o=md.opponent.trim().toLowerCase();
    [...D.matchdays].filter(m=>m.id!==md.id&&m.opponent.trim().toLowerCase()===o).sort((a,b)=>b.date.localeCompare(a.date)).forEach(m=>m.people.filter(p=>p.team==='gast').forEach(p=>names.push(p.name)))}
  const seen=new Set();return names.filter(n=>{const k=n.toLowerCase();if(present.has(k)||seen.has(k))return false;seen.add(k);return true}).slice(0,24);
}
function vTeam(md,team){

  const sum=ppl.reduce((a,p)=>a+totalOf(md,p),0);

  let h=`<section class="team ${team}"><header><h3>${esc(title)}</h3><span class="muted small">${ppl.length} ${ppl.length===1?'Person':'Personen'}, ${eur(sum)}</span></header>
    <form class="addp" data-form="addP" data-team="${team}"><input type="text" id="add-${team}" name="n" placeholder="Name eingeben, Enter (mehrere mit Komma)" autocomplete="off" aria-label="Person hinzufügen"><button class="btn">Hinzufügen</button></form>`;
  if(sug.length){h+=`<div class="chips">${sug.length>1?`<button class="chip all" data-act="allChips" data-team="${team}">Alle ${sug.length} übernehmen</button>`:''}${sug.map(n=>`<button class="chip" data-act="chip" data-team="${team}" data-name="${esc(n)}">+ ${esc(n)}</button>`).join('')}</div>`}
  if(!ppl.length)h+=`<p class="muted small">${team==='heim'?'Noch keine eigenen Spieler eingetragen.':'Noch keine Gastspieler eingetragen.'}</p>`;
  h+=`<div class="people">${ppl.map(p=>vPerson(md,p)).join('')}</div></section>`;
  return h;
}
function vPerson(md,p){
  const t=totalOf(md,p),pd=p.paid||0;
  const st=t>0&&pd>=t-0.001?'paid':(pd>0?'part':'');
  let btn;
  if(t===0&&pd===0)btn=`<button class="pay" disabled>Nichts offen</button>`;
  else if(pd>=t-0.001&&pd<=t+0.001)btn=`<button class="pay done" data-act="pay" data-p="${p.id}" title="Zahlung zurücknehmen">Bezahlt ✓</button>`;
  else if(pd>t)btn=`<button class="pay rest" data-act="pay" data-p="${p.id}">Zahlung korrigieren</button>`;
  else if(pd>0)btn=`<button class="pay rest" data-act="pay" data-p="${p.id}">Rest ${eur(t-pd)} kassieren</button>`;
  else btn=`<button class="pay" data-act="pay" data-p="${p.id}">Kassieren</button>`;
  return `<article class="person ${st}"><div class="ph"><strong title="${esc(p.name)}">${esc(p.name)}</strong>
    <span><button class="x" data-act="printP" data-p="${p.id}" title="Rechnung drucken">🧾</button><button class="x" data-act="delP" data-p="${p.id}" title="Person entfernen">×</button></span></div>
    ${CATS.map(c=>{const n=countOf(md,p,c.k);return `<div class="cnt"><span>${c.i} ${c.n}</span><button data-act="minus" data-p="${p.id}" data-c="${c.k}" ${n?'':'disabled'} aria-label="${c.n} minus">−</button><b>${n}</b><button class="plus" data-act="plus" data-p="${p.id}" data-c="${c.k}" aria-label="${c.n} plus">+</button></div>`}).join('')}
    <div class="pf"><span class="sum">${eur(t)}</span>${btn}</div>
    ${pd>t+0.001?`<div class="note">Bereits ${eur(pd)} bezahlt, ${eur(pd-t)} zu viel.</div>`:pd>0&&pd<t?`<div class="note">${eur(pd)} bereits bezahlt</div>`:''}</article>`;
}

function doPrint(mdId,pid){
  const md=D.matchdays.find(m=>m.id===mdId);if(!md)return;
  const head=`<div class="phead">${logoMarkup()}<div><h1>${esc(D.settings.club)}</h1><div>${md.type==='training'?'Training':'Heimspiel gegen '+esc(md.opponent)}, ${esc(fmtDate(md.date))}</div></div></div>`;
  let h=head;
  if(pid){
    const p=md.people.find(x=>x.id===pid);const t=totalOf(md,p);
    h+=`<h2>Rechnung für ${esc(p.name)}</h2><table><thead><tr><th>Getränk</th><th style="text-align:right">Anzahl</th><th style="text-align:right">Betrag</th></tr></thead><tbody>`;
    CATS.forEach(c=>{const ss=salesOf(md,p).filter(s=>s.cat===c.k);const n=ss.reduce((a,s)=>a+s.qty,0);if(n)h+=`<tr><td>${c.n}</td><td style="text-align:right">${n}</td><td style="text-align:right">${eur(ss.reduce((a,s)=>a+s.qty*s.price,0))}</td></tr>`});
    h+=`<tr class="tot"><td>Summe</td><td></td><td style="text-align:right">${eur(t)}</td></tr></tbody></table><p>${(p.paid||0)>=t-0.001&&t>0?'Bezahlt. Vielen Dank!':'Offen: '+eur(Math.max(0,t-(p.paid||0)))}</p>`;
  }else{
    let grand=0;
    ['heim','gast'].forEach(team=>{const ppl=md.people.filter(p=>p.team===team);if(!ppl.length)return;
      h+=`<h2>${esc(team==='heim'?D.settings.club:md.opponent)}</h2><table><thead><tr><th>Name</th>${CATS.map(c=>`<th style="text-align:right">${c.n}</th>`).join('')}<th style="text-align:right">Summe</th><th>Status</th></tr></thead><tbody>`;
      let sub=0;ppl.forEach(p=>{const t=totalOf(md,p);sub+=t;h+=`<tr><td>${esc(p.name)}</td>${CATS.map(c=>`<td style="text-align:right">${countOf(md,p,c.k)||''}</td>`).join('')}<td style="text-align:right">${eur(t)}</td><td>${t===0?'':(p.paid||0)>=t-0.001?'bezahlt':'offen '+eur(t-(p.paid||0))}</td></tr>`});
      grand+=sub;h+=`<tr class="tot"><td>Summe</td>${CATS.map(()=>'<td></td>').join('')}<td style="text-align:right">${eur(sub)}</td><td></td></tr></tbody></table>`});
    h+=`<p class="tot" style="margin-top:14px">Gesamt: ${eur(grand)}</p>`;
  }
  document.getElementById('print').innerHTML=h;
  setTimeout(()=>window.print(),50);
}

const curMd=()=>D.matchdays.find(m=>m.id===ui.md);
function addPeople(team,names){
  const md=curMd();if(!md)return 0;let n=0;
  names.map(s=>s.trim()).filter(Boolean).forEach(name=>{
    if(md.people.some(p=>p.team===team&&p.name.toLowerCase()===name.toLowerCase()))return;
    md.people.push({id:uid(),name,team,paid:0});n++});
  if(n)save();return n;
}
const act={
  tab:el=>{ui.tab=el.dataset.tab;render();window.scrollTo(0,0)},
  newMd:el=>{const k=el.dataset.k||'spiel';ui.showNewMd=ui.showNewMd===k?false:k;ui.focus=k==='spiel'?'newOpp':null;render()},
  plus:el=>{const md=curMd(),c=el.dataset.c;D.sales.push({id:uid(),md:md.id,p:el.dataset.p,cat:c,qty:1,price:num(D.settings.prices[c]),fp:num(D.settings.fp[c]),ts:Date.now()});save();render()},
  minus:el=>{const md=curMd();const ss=D.sales.filter(s=>s.md===md.id&&s.p===el.dataset.p&&s.cat===el.dataset.c).sort((a,b)=>b.ts-a.ts);
    if(ss[0]){tomb(ss[0].id);D.sales=D.sales.filter(s=>s!==ss[0]);save();render()}},
  pay:el=>{const md=curMd(),p=md.people.find(x=>x.id===el.dataset.p),t=totalOf(md,p),pd=p.paid||0;
    if(pd>=t-0.001&&pd<=t+0.001){if(!confirm('Zahlung von '+p.name+' ('+eur(pd)+') zurücknehmen?'))return;p.paid=0;p.paidTs=Date.now()}
    else{p.paid=t;p.paidTs=Date.now();toast(p.name+': '+eur(t-pd)+' kassiert')}
    save();render()},
  delP:el=>{const md=curMd(),p=md.people.find(x=>x.id===el.dataset.p);const has=salesOf(md,p).length||p.paid;
    if(has&&!confirm(p.name+' mit allen gebuchten Getränken entfernen?'))return;
    tomb(p.id,...salesOf(md,p).map(s=>s.id));D.sales=D.sales.filter(s=>!(s.md===md.id&&s.p===p.id));md.people=md.people.filter(x=>x!==p);save();render()},
  chip:el=>{addPeople(el.dataset.team,[el.dataset.name]);render()},
  allChips:el=>{const md=curMd();addPeople(el.dataset.team,suggestions(md,el.dataset.team));render()},
  delMd:el=>{const md=D.matchdays.find(m=>m.id===el.dataset.md);if(!confirm((md.type==='training'?'Trainingstag':'Spieltag gegen '+md.opponent)+' am '+fmtDate(md.date)+' mit allen Buchungen löschen?'))return;
    tomb(md.id,...D.sales.filter(s=>s.md===md.id).map(s=>s.id));D.sales=D.sales.filter(s=>s.md!==md.id);D.matchdays=D.matchdays.filter(m=>m!==md);ui.md=null;save();render()},
  print:el=>doPrint(el.dataset.md),
  printP:el=>doPrint(ui.md,el.dataset.p),
  qty:el=>{document.getElementById('bqty').value=el.dataset.q},
  delBatch:el=>{const b=D.batches.find(x=>x.id===el.dataset.id);if(!confirm('Einkauf ('+b.qty+'× '+CATN[b.cat]+') löschen? Bereits verkaufte Flaschen werden dann dem Fanprojekt zugerechnet.'))return;
    tomb(b.id);D.batches=D.batches.filter(x=>x!==b);save();render()},
  fpFill:el=>{document.getElementById('mvAmt').value=String(el.dataset.v).replace('.',',')},
  delMove:el=>{if(!confirm('Buchung löschen?'))return;tomb(el.dataset.id);D.moves=D.moves.filter(m=>m.id!==el.dataset.id);save();render()},
  fileNew, fileOpen, fileReconnect, fileDisconnect,
  exp:exportJson,
  share:shareState,
  syncNow:()=>{syncNow();toast('Gleiche ab …')},
  syncOff:()=>{if(!confirm('Token und alle Kassendaten von diesem Gerät entfernen? Online bleibt alles erhalten und erscheint wieder, sobald der Token erneut eingegeben wird.'))return;
    SY.token='';SY.blocked=false;saveSyncCfg();D=blank();try{localStorage.removeItem(LS_KEY)}catch(e){};fh=null;fhPending=null;idbDel('fh');syncState='off';ui.md=null;renderHeader();status();render()},
  imp:()=>document.getElementById('impFile').click(),
  logoUp:()=>document.getElementById('logoFile').click(),
  logoDel:()=>{D.logo=null;D.settingsTs=Date.now();save();renderHeader();render()},
  reset:()=>{if(!confirm('Wirklich alle Daten löschen? Das lässt sich nicht rückgängig machen.'))return;
    const keep={settings:D.settings,logo:D.logo};D=normalize(keep);save();ui.md=null;render();toast('Alle Daten gelöscht')}
};
const forms={
  unlock:f=>{const t=f.elements.token.value.trim();if(!t)return;SY.token=t;if(f.elements.owner.value.trim())SY.owner=f.elements.owner.value.trim();if(f.elements.repo.value.trim())SY.repo=f.elements.repo.value.trim();
    SY.blocked=true;saveSyncCfg();ui.checking=true;syncErr='';render();status();syncNow()},
  newTr:f=>{const md={id:uid(),type:'training',date:f.elements.date.value||todayStr(),opponent:'Training',people:[],created:Date.now()};
    const seen=new Set();D.settings.roster.forEach(n=>{const k=n.toLowerCase();if(!seen.has(k)){seen.add(k);md.people.push({id:uid(),name:n,team:'heim',paid:0})}});
    D.matchdays.push(md);ui.md=md.id;ui.showNewMd=false;save();render();toast('Trainingstag angelegt')},
  sync:f=>{SY.owner=f.elements.owner.value.trim();SY.repo=f.elements.repo.value.trim();if(f.elements.token.value.trim())SY.token=f.elements.token.value.trim();
    if(!SY.token){toast('Bitte den Token eintragen.');return}
    saveSyncCfg();syncState='busy';render();status();syncNow().then(()=>{if(syncState==='ok')toast('Online-Abgleich eingerichtet')})},
  newMd:f=>{const opp=f.elements.opp.value.trim();if(!opp)return;const md={id:uid(),date:f.elements.date.value||todayStr(),opponent:opp,people:[],created:Date.now()};
    D.matchdays.push(md);ui.md=md.id;ui.showNewMd=false;save();ui.focus='add-heim';render()},
  addP:f=>{const team=f.dataset.team;addPeople(team,f.elements.n.value.split(','));ui.focus='add-'+team;render()},
  batch:f=>{const qty=Math.round(num(f.elements.qty.value));if(qty<1){toast('Bitte eine Anzahl eingeben.');return}
    const ts=f.elements.ts.value?new Date(f.elements.ts.value).getTime():Date.now();
    D.batches.push({id:uid(),cat:f.elements.cat.value,qty,cost:num(f.elements.cost.value),ts,fromKasse:f.elements.fromKasse.checked,note:f.elements.note.value.trim()});
    save();render();toast(qty+'× '+CATN[f.elements.cat.value]+' eingebucht')},
  move:f=>{const a=Math.abs(num(f.elements.amt.value));if(!a){toast('Bitte einen Betrag eingeben.');return}
    const type=f.elements.type.value;D.moves.push({id:uid(),ts:Date.now(),type,amt:type==='ein'?a:-a,note:f.elements.note.value.trim()});save();render();toast('Gebucht')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=act[el.dataset.act];if(fn){e.preventDefault();fn(el,e)}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();forms[f.dataset.form]?.(f)});
document.addEventListener('change',e=>{const el=e.target;const k=el.dataset.change;
  if(k==='selMd'){ui.md=el.value;render()}
  else if(k==='set'){const [a,b]=el.dataset.path.split('.');
    if(b)D.settings[a][b]=num(el.value);else D.settings[a]=a==='club'?el.value.trim()||'DC Rot-Blau Wuppertal':num(el.value);
    D.settingsTs=Date.now();save();if(a==='club')renderHeader();toast('Gespeichert')}
  else if(k==='roster'){D.settings.roster=el.value.split('\n').map(s=>s.trim()).filter(Boolean);D.settingsTs=Date.now();save();toast('Stammspieler gespeichert')}
});
document.getElementById('impFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)importJson(f);e.target.value=''});
document.getElementById('logoFile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=320,sc=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    D.logo=c.toDataURL('image/png');D.settingsTs=Date.now();save();renderHeader();render();toast('Logo übernommen')};img.src=r.result};r.readAsDataURL(f)});
window.addEventListener('beforeunload',e=>{if(fh&&fileState==='saving'){e.preventDefault();e.returnValue=''}});

/* ===================== Start ===================== */
(async function init(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw)D=normalize(JSON.parse(raw))}catch(e){}
  renderHeader();render();status();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if(syncOn())syncNow();
  if(FS_OK){const h=await idbGet('fh');
    if(h){try{const p=await h.queryPermission({mode:'readwrite'});
      if(p==='granted'){await useHandle(h)}else{fhPending=h;status();if(ui.tab==='einstellungen')render();
        toast('Klicke oben rechts, um mit '+h.name+' weiterzuarbeiten')}}catch(e){}}}
  document.getElementById('fileChip').addEventListener('click',e=>{if(syncOn()&&syncState!=='err'){e.stopPropagation();e.preventDefault();syncNow();toast('Gleiche ab …');return}if(fhPending){e.stopPropagation();e.preventDefault();fileReconnect()}},true);
})();
</script>
</body>
</html>
